# .gitleaks.toml — aegis-statefulset gitleaks configuration
#
# Companion to .github/workflows/secret-scanning.yml. Defines the
# repo-specific allowlist of patterns that LOOK like secrets to
# gitleaks's default detectors but aren't.
#
# Per ADR-09 supply-chain discipline, this file is itself part of
# the security architecture: it makes the scanner's decisions
# auditable + repeatable across local + CI runs.
#
# Conventions for adding allowlist entries:
#   1. Each entry MUST have an inline comment explaining WHY it's
#      not a secret (false positive justification)
#   2. Prefer narrowest regex possible — global `.*` patterns risk
#      masking real leaks
#   3. Path allowlists are last resort — prefer regex if possible

title = "aegis-statefulset"

# Extend gitleaks default rules — we want all baseline detectors active,
# plus our allowlists below.
[extend]
useDefault = true

# Global allowlist (applies to all rules)
[allowlist]
description = "Repo-specific false-positive patterns"

regexes = [
    # GitHub Actions workflow pins — `uses: owner/action@<40-char-hex>` is
    # the canonical ADR-09 supply-chain pinning pattern. The 40-char hex is
    # a git commit SHA, not a secret. Without this allowlist, gitleaks's
    # generic-api-key entropy detector flags every action pin as suspect.
    '''uses:\s+[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+@[0-9a-f]{40}''',

    # Chaos-demo seed-test-data fixtures — generated by
    # `scripts/chaos/seed-test-data.sh` as `chaos-test-value-<UTC-iso>-chaos-test-<N>`.
    # These are deterministic test values for data-integrity verification,
    # not credentials.
    '''chaos-test-value-[0-9TZ]+-chaos-test-[0-9]+''',

    # Image SHA digests in Helm values + StatefulSet templates — these are
    # SHA256 digests of container images, not secrets. Pattern:
    # `sha256:[64-char-hex]` appearing on `digest:` line or `@sha256:` ref.
    '''(@|digest:\s+)sha256:[0-9a-f]{64}''',

    # Git commit SHAs in markdown changelogs / commit messages embedded in
    # docs — backtick-wrapped 7-or-40-char hex that follows a "commit" word
    # context. Example: "Commit `0a16545` — Helm: startupProbe".
    '''(commit|`)\s*[`a-f0-9]{7,40}''',

    # Velero / K8s namespace UIDs — `uid: <UUID>` in kubectl get -o yaml
    # output, mentioned in chaos-evidence capture snapshots.
    '''uid:\s+[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
]

paths = [
    # The pre-commit hook script intentionally contains secret-pattern regexes
    # (AKIA / BEGIN PRIVATE KEY / etc.) as its BLOCK/WARN detection logic.
    # gitleaks scanning the hook source itself would match its own patterns.
    '''scripts/git-hooks/pre-commit''',

    # ADR-07 (security & runtime) discusses credential patterns in security
    # context — explaining what to detect, not actually containing credentials.
    # The doc cites patterns like AKIA / OIDC token / etc. as examples.
    '''docs/adr/ADR-07-security-and-runtime\.md''',

    # why-velero-not-restic.md § "What would explode if we tried Restic + LVM
    # literally" discusses encryption-key bootstrap problems, may mention
    # password-related patterns in failure-mode discussion.
    '''docs/operations/why-velero-not-restic\.md''',

    # _context/ is gitignored anyway, but explicit safety in case of mis-stage
    '''_context/.*''',
]

stopwords = [
    # Substring matches that always indicate false positive — gitleaks skips
    # any match containing these substrings even if other rules trigger.
    # Use sparingly; this is global.
    "example",       # generic placeholder substring in doc strings
    "REPLACE_ME",    # explicit placeholders
    "TODO_FILL",     # values.yaml placeholders for image digests
    "PLACEHOLDER",
]
