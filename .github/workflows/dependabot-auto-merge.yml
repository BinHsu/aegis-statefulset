# Auto-merge Dependabot PRs once required checks pass.
# Scope guard: only patch + minor updates auto-merge. Major bumps are held
# for manual review (they carry breaking changes — see the aws provider 5->6
# and rardecode 2.1->2.2 incidents, 2026-07).
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only run on Dependabot-authored PRs.
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0

      # No `gh pr review --approve` here. GitHub refuses it — "GitHub Actions is
      # not permitted to approve pull requests" — unless the repository opts in
      # to letting Actions approve, which would let this workflow satisfy the
      # branch ruleset's review requirement by itself. That opt-in is a decision
      # about review integrity, not a CI detail, so the job enables auto-merge
      # and waits for a real approval instead of failing on a forbidden call.
      - name: Enable auto-merge (patch + minor only)
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
