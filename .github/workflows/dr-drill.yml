# DR Drill — manual + scheduled disaster-recovery rehearsal.
#
# Implements:
#   - ADR-013 (cluster recovery three paths — Path A / B / C)
#   - ADR-039 (SHA-pinned actions)
#
# Cadence:
#   - Manual via workflow_dispatch (any time, any path)
#   - Quarterly schedule (first Monday of Jan / Apr / Jul / Oct, 06:00 UTC)
#
# Output: a GitHub issue with the drill report (RTO observed, deltas vs
# target, action items). The issue is labelled `dr-drill` for tracking.

name: DR Drill

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Recovery path to drill'
        required: true
        default: 'A'
        type: choice
        options:
          - A    # EBS survives, cluster destroyed
          - B    # Routing table loss
          - C    # EBS lost, full restore from S3
  schedule:
    # Quarterly: 06:00 UTC on day 1 of Jan / Apr / Jul / Oct
    - cron: '0 6 1 1,4,7,10 *'

permissions:
  contents: read
  issues: write    # to file the drill report

jobs:
  drill:
    name: Run DR drill
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Determine path
        id: path
        run: |
          set -euo pipefail
          path_arg='${{ github.event.inputs.path }}'
          # Scheduled runs default to Path A (most common scenario per ADR-013)
          if [ -z "$path_arg" ]; then
            path_arg='A'
          fi
          echo "selected=$path_arg" >> "$GITHUB_OUTPUT"

      - name: Run DR drill (placeholder)
        id: drill
        env:
          DR_PATH: ${{ steps.path.outputs.selected }}
        run: |
          set -euo pipefail
          echo "Drilling DR Path ${DR_PATH}"

          # TODO (operational follow-up):
          #   1. Spin up an ephemeral cluster (kind / k3d) with sample EBS-equivalent
          #      volumes pre-populated.
          #   2. For Path A: simulate cluster destruction; run scripts/dr/recover-cluster.sh;
          #      verify pod count matches discovered EBS count.
          #   3. For Path B: wipe the routing override ConfigMap; run
          #      scripts/dr/warm-routing-table.sh; verify override entries match
          #      pod-on-disk truth.
          #   4. For Path C: delete simulated EBS; run scripts/dr/restore-from-s3.sh
          #      against a seeded test bucket; verify data restored.
          #   5. Capture observed RTO; compare against target per ADR-013.

          start=$(date +%s)
          echo "Drill start: $(date -Iseconds)"

          case "$DR_PATH" in
            A) target_rto_minutes=30 ;;
            B) target_rto_minutes=30 ;;
            C) target_rto_minutes=720 ;;
            *) echo "::error::Unknown path $DR_PATH"; exit 1 ;;
          esac

          # Placeholder body — real drill uses kind cluster + scripted scenario.
          sleep 5

          end=$(date +%s)
          observed_seconds=$((end - start))
          observed_minutes=$((observed_seconds / 60))

          {
            echo "drill_path=$DR_PATH"
            echo "observed_minutes=$observed_minutes"
            echo "target_minutes=$target_rto_minutes"
          } >> "$GITHUB_OUTPUT"

      - name: File drill report issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0 — SHA-pinned per ADR-09; refresh via Renovate
        with:
          script: |
            const path = '${{ steps.drill.outputs.drill_path }}';
            const observed = '${{ steps.drill.outputs.observed_minutes }}';
            const target = '${{ steps.drill.outputs.target_minutes }}';
            const date = new Date().toISOString().slice(0, 10);

            const body = [
              `# DR drill report — Path ${path} — ${date}`,
              '',
              '## Summary',
              `- **Path drilled:** ${path}`,
              `- **Observed RTO:** ${observed} min`,
              `- **Target RTO (per ADR-013):** ${target} min`,
              '',
              '## Action items',
              '- [ ] Review observed vs target. If gap > 20%, file a remediation issue.',
              '- [ ] Update `scripts/dr/README.md` if procedure changed.',
              '- [ ] Confirm next drill scheduled (quarterly cron).',
              '',
              '_Generated automatically by `dr-drill.yml`._',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `DR drill report — Path ${path} — ${date}`,
              body,
              labels: ['dr-drill'],
            });
