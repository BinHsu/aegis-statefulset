# Terraform Plan — runs on PRs that touch infrastructure/terraform/.
#
# Implements:
#   - ADR-034 (four-workflow split — this is the infra-plan workflow)
#   - ADR-037 (Terraform CI surface)
#   - ADR-039 (SHA-pinned actions)
#
# Behaviour:
#   - Runs `terraform plan` against a real backend (read-only credentials)
#   - Posts a summary comment on the PR with resource adds/changes/destroys
#   - Does NOT auto-apply; apply is a separate manual workflow with branch
#     protection on main (out of scope for this file)
#
# Activation gate:
#   The plan job needs AWS OIDC — a GitHub OIDC identity provider in the
#   AWS account plus the read-only role whose ARN is the repository secret
#   TERRAFORM_PLAN_ROLE_ARN (the AWS bootstrap, internal backlog B4).
#   Until that bootstrap is done the job skips cleanly (shows as skipped,
#   not failed) instead of erroring on missing credentials on every PR —
#   the same conditional-skip posture as codeql.yml. To activate: complete
#   the OIDC bootstrap, set the TERRAFORM_PLAN_ROLE_ARN secret, and set the
#   repository variable ENABLE_TERRAFORM_PLAN to "true".

name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  pull-requests: write   # to post the plan summary comment
  id-token: write        # for AWS OIDC role assumption

jobs:
  plan:
    name: Terraform plan
    # Skips cleanly until the AWS OIDC bootstrap (backlog B4) is done — see
    # the activation gate in the header. The role ARN stays a secret (it
    # carries the AWS account ID); the gate is a non-sensitive boolean var.
    if: ${{ vars.ENABLE_TERRAFORM_PLAN == 'true' }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Configure AWS credentials (OIDC, read-only)
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6.1.1 — SHA-pinned per ADR-09; refresh via Renovate
        with:
          role-to-assume: ${{ secrets.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          # Must satisfy versions.tf required_version (>= 1.10).
          terraform_version: '1.14.8'

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        id: plan
        run: |
          set -euo pipefail
          terraform plan -no-color -out=tfplan.binary > plan.txt 2>&1 || {
            echo "::error::terraform plan failed"
            cat plan.txt
            exit 1
          }
          # Truncate to last ~300 lines for the PR comment
          tail -n 300 plan.txt > plan-summary.txt
          {
            echo 'plan<<PLAN_EOF'
            cat plan-summary.txt
            echo 'PLAN_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post plan summary on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0 — SHA-pinned per ADR-09; refresh via Renovate
        with:
          script: |
            const plan = `${{ steps.plan.outputs.plan }}`;
            const body = [
              '### Terraform plan',
              '',
              '<details><summary>Plan output (last 300 lines)</summary>',
              '',
              '```',
              plan,
              '```',
              '',
              '</details>',
              '',
              '_Posted automatically by `terraform-plan.yml`._',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
