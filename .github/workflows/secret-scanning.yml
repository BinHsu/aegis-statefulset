# Secret Scanning — gitleaks + trufflehog scan repo for committed secrets,
# both on every PR and as a daily scheduled scan to catch secrets that may
# have entered via squash-merge or force-push pattern after PR review.
#
# Implements:
#   - ADR-039 (SHA pinning)
#   - OWASP CI/CD Top 10 — CICD-SEC-6 (Insufficient Credential Hygiene)
#
# Defense layered with:
#   - ADR-027 (Secrets Manager + ESO) — runtime secrets never in repo
#   - .gitleaks.toml — repo-specific allowlist (test fixtures, etc.)
#
# Trigger: PR to main, push to main, daily 04:00 UTC scheduled scan.

name: Secret Scanning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'  # daily 04:00 UTC — catches post-merge regressions

permissions:
  contents: read
  pull-requests: write  # gitleaks-action posts findings to PR

jobs:
  gitleaks:
    name: gitleaks scan
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0  # full history — gitleaks needs every commit

      - name: Run gitleaks
        # NOTE: still on Node 20. Upstream is stalled — latest release (v2.3.9)
        # and the `master` HEAD both declare `using: node20`; no Node-24
        # release exists. Will break when GitHub Actions removes Node 20
        # (2026-09-16). Tracked in BACKLOG C16 — evaluate replacement (gitleaks
        # CLI in a `run:` step, or trufflehog-only) before the removal date.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9 — SHA-pinned per ADR-09; refresh via Renovate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is optional — pro license enables additional rules,
          # SAST mode, and org-level reporting. POC uses OSS rules only.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trufflehog:
    name: trufflehog scan
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      # trufflehog complements gitleaks: trufflehog has stronger verification
      # (actively probes secret validity against the issuing service), gitleaks
      # has stronger entropy/regex coverage. Both run; either can fail the build.
      #
      # base/head must differ per event:
      #   - push event:        previous commit (event.before) → current (event.after)
      #   - pull_request:      PR base → PR head
      #   - schedule:          empty (action defaults to whole-repo scan)
      # Hardcoding `main → HEAD` errors on push events because both resolve to
      # the same commit, triggering the action's BASE == HEAD abort.
      - name: Run trufflehog (verified secrets only)
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab  # v3.95.3 — SHA-pinned per ADR-09; refresh via Renovate
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.event.after }}
          # --only-verified suppresses noise: only secrets that successfully
          # authenticate against the issuing service fail the build.
          extra_args: --only-verified
