# DAST (Dynamic Application Security Testing) — OWASP ZAP baseline scan
# against a deployed dev environment, weekly. Catches runtime issues that
# static SAST and image scanning don't see (auth bypass, IDOR, header
# misconfiguration, TLS posture).
#
# Implements:
#   - ADR-039 (SHA pinning)
#   - OWASP CI/CD Top 10 — CICD-SEC-1 (Insufficient Flow Control) — DAST is a
#     post-deploy verification gate
#
# Defense layered with:
#   - ADR-026 (NetworkPolicy zero-trust) — DAST runs from outside, validates external surface
#   - ADR-030 (Edge TLS) — DAST verifies TLS configuration end-to-end
#   - ADR-029 (SIEM) — DAST scan generates traffic Wazuh should classify as benign-test
#
# Skeleton — target URL placeholder; final URL configured in dev env.
# Trigger: manual dispatch only. The scheduled run was removed because there
# is no persistent dev environment for this POC — a weekly cron against an
# unresolvable placeholder host produced guaranteed-red CI. Re-add the
# `schedule:` block once a stable dev URL exists and is set as the default.

name: DAST (OWASP ZAP)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan (overrides default dev env)'
        required: false
        type: string

permissions:
  contents: read
  issues: write  # ZAP action opens issues for findings

jobs:
  zap-baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Resolve target URL
        id: target
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.target_url }}" ]; then
            echo "url=${{ inputs.target_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://aegis-statefulset-dev.example.com" >> "$GITHUB_OUTPUT"
          fi

      # Reachability guard. action-baseline exits non-zero (code 3) when it
      # cannot reach the target at all — `fail_action: false` only suppresses
      # failures from findings, not an unreachable host. Without a persistent
      # dev environment the default target is an unresolvable placeholder, so
      # check DNS first and skip the scan cleanly rather than going red.
      - name: Check target reachability
        id: guard
        run: |
          set -euo pipefail
          url='${{ steps.target.outputs.url }}'
          host=$(printf '%s' "$url" | sed -E 's#^[a-zA-Z]+://##; s#[:/].*$##')
          if getent hosts "$host" >/dev/null 2>&1; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "Target host '$host' resolves — proceeding with ZAP baseline scan."
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Target host '$host' does not resolve — skipping ZAP scan." \
                 "Re-run via workflow_dispatch with a reachable target_url."
          fi

      # ZAP baseline scan: passive checks only (no active attack payloads).
      # Suitable for scheduled runs against a real dev environment without risk
      # of breaking it. For pre-prod we'd run zap-full-scan against a dedicated
      # ephemeral env — out of POC scope.
      - name: Run ZAP baseline
        if: steps.guard.outputs.reachable == 'true'
        uses: zaproxy/action-baseline@1e1871e84428617b969d4a1f981a8255630d54b0  # v0.10.0 — SHA-pinned per ADR-09; refresh via Renovate
        with:
          target: ${{ steps.target.outputs.url }}
          # Custom rule overrides — disable noisy or known-irrelevant checks.
          # Format: WARN/FAIL/IGNORE per rule ID. Maintained alongside this file.
          rules_file_name: '.zap-rules.tsv'
          # action-baseline opens a GitHub issue summarising findings; the
          # security label routes to the same triage queue as gitleaks /
          # policy-validation / kyverno-deny-audit.
          allow_issue_writing: true
          issue_title: 'DAST (ZAP) — weekly baseline findings'
          fail_action: false  # baseline findings are advisory at POC stage
          cmd_options: '-a'   # include alpha rules for broader coverage
