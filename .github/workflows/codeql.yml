# CodeQL — static application security testing for the Go workload.
#
# Implements:
#   - ADR-07 (security and runtime — application-layer SAST)
#   - ADR-09 (supply chain — complements the dependency-level scanners)
#   - ADR-039 (SHA-pinned third-party actions)
#
# CodeQL covers logic flaws the dependency scanners (govulncheck, Trivy,
# dependency-review) cannot see — tainted data flow, injection, unsafe
# constructs in app/. The govulncheck job in pr-validation.yml answers
# "do my dependencies have known CVEs"; this answers "does my own code
# have a vulnerability".
#
# Code scanning needs a public repo or GitHub Advanced Security. This
# repo is public, so the analyze job runs. The visibility guard is kept
# for portability: if the repo is ever made private the job skips
# cleanly (shows as skipped, not failed) instead of erroring.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read           # codeql-action reads workflow-run metadata
  contents: read
  security-events: write  # required to upload the SARIF results

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ github.event.repository.private == false }}
    name: Analyze (go)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0 — SHA-pinned per ADR-09; refresh via Renovate
        with:
          go-version-file: app/go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@bc0b696b4103f5fe60f15749af68a046868d511a  # codeql-bundle-v2.25.4 — SHA-pinned per ADR-09; refresh via Renovate
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@bc0b696b4103f5fe60f15749af68a046868d511a  # codeql-bundle-v2.25.4
        with:
          # The Go module lives in app/, not the repo root.
          working-directory: app

      - name: Analyze
        uses: github/codeql-action/analyze@bc0b696b4103f5fe60f15749af68a046868d511a  # codeql-bundle-v2.25.4
