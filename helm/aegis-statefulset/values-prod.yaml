# values-prod.yaml — overrides for production environment.
# Default values are already production-tuned; this file lists explicit
# prod choices for traceability.
# Apply alongside default values.yaml:
#   helm install aegis ./helm/aegis-statefulset -f values-prod.yaml

stateful:
  cells:
    # Production: cells.count = N (set via terraform import per ADR-05
    # to match existing per-tenant pod inventory).
    count: 9
    # Multi-PVC layout (Path γ per ADR-02) — see values.yaml for rationale.
    # Production: data 1843Gi + wal 205Gi ≈ 2 TiB total (10% WAL ratio).
    # Tuning rationale: LDB SSTable forest grows as compaction merges
    # writes; WAL is short-lived (synced + truncated on memtable flush)
    # so 10% is a safe upper bound for WAL pod-local working set.
    storage:
      data: 1843Gi
      wal: 205Gi
  resources:
    requests:
      cpu: 2
      memory: 24Gi
    limits:
      cpu: 8
      memory: 32Gi
  pod_anti_affinity:
    type: hard

api:
  replicas: 3
  pod_anti_affinity:
    type: hard

envoy:
  replicas: 3
  pod_anti_affinity:
    type: hard

backup:
  cadence_minutes: 5
  retention_days: 30
  cross_region:
    enabled: true

ha:
  model: cold_dr

# All other values from values.yaml apply.
