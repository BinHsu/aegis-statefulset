# values-dev.yaml — overrides for development environment.
# Lower scale, faster iteration.
# Apply alongside default values.yaml:
#   helm install aegis ./helm/aegis-statefulset -f values-dev.yaml

stateful:
  cells:
    count: 1
    # Multi-PVC layout (Path γ per ADR-02) — see values.yaml for rationale.
    # Dev: data 45Gi + wal 5Gi = 50Gi total (smaller for dev cost)
    storage:
      data: 45Gi
      wal: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

backup:
  cadence_minutes: 60       # hourly cadence, lower frequency for dev
  cross_region:
    enabled: false           # dev doesn't need DR

ha:
  model: cold_dr  # default; dev still uses cold DR for parity

api:
  replicas: 1  # single replica for dev

envoy:
  replicas: 1  # single replica for dev
