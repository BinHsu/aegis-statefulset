# Blackbox Exporter for continuous external probe of public endpoints.
# Wave 4 addition: catches edge-of-system failures (DNS, TLS, ALB) that
# ServiceMonitor in-cluster scrape cannot see.
{{- if .Values.observability.blackbox.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis-statefulset.fullname" . }}-blackbox-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-statefulset.labels" . | nindent 4 }}
    app.kubernetes.io/component: blackbox-exporter
spec:
  replicas: 2
  selector:
    matchLabels:
      {{- include "aegis-statefulset.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: blackbox-exporter
  template:
    metadata:
      labels:
        {{- include "aegis-statefulset.labels" . | nindent 8 }}
        app.kubernetes.io/component: blackbox-exporter
    spec:
      serviceAccountName: {{ include "aegis-statefulset.serviceAccountName" . }}

      # Pod security per ADR-07
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: blackbox-exporter
          image: "prom/blackbox-exporter:v0.25.0@sha256:TODO_VERIFY_FROM_DOCKER_HUB"
          # TODO: pull and verify from quay.io/prometheus/blackbox-exporter:v0.25.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/config/blackbox.yaml"
          ports:
            - name: probe
              containerPort: 9115
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config

          # Container security context per ADR-07
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9115
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: config
          configMap:
            name: {{ include "aegis-statefulset.fullname" . }}-blackbox-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis-statefulset.fullname" . }}-blackbox-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-statefulset.labels" . | nindent 4 }}
    app.kubernetes.io/component: blackbox-exporter
data:
  blackbox.yaml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          method: GET
          valid_status_codes: [200]
          fail_if_ssl: false
          fail_if_not_ssl: false
          preferred_ip_protocol: "ip4"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis-statefulset.fullname" . }}-blackbox-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-statefulset.labels" . | nindent 4 }}
    app.kubernetes.io/component: blackbox-exporter
spec:
  type: ClusterIP
  selector:
    {{- include "aegis-statefulset.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: blackbox-exporter
  ports:
    - name: probe
      port: 9115
      targetPort: 9115
      protocol: TCP
---
# Probe CRD telling Prometheus Operator which targets to scrape via blackbox.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: {{ include "aegis-statefulset.fullname" . }}-blackbox-probe
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-statefulset.labels" . | nindent 4 }}
    app.kubernetes.io/component: blackbox-exporter
spec:
  jobName: aegis-blackbox
  interval: {{ .Values.observability.blackbox.scrape_interval }}
  module: http_2xx
  prober:
    url: {{ include "aegis-statefulset.fullname" . }}-blackbox-exporter:9115
    scheme: http
    path: /probe
  targets:
    staticConfig:
      static:
        {{- range .Values.observability.blackbox.probe_targets }}
        - {{ . | quote }}
        {{- end }}
{{- end }}
