{{- /*
  ServiceMonitor for the per-tenant telemetry sidecar (per ADR-01).

  Scrapes the sidecar's metrics-tenant port (:9091) via the headless
  service. The selector matches SERVICE labels, not pod labels.

  Skipped when relocation.telemetry.source != "sidecar" because there
  is no sidecar to scrape in that mode.
*/ -}}
{{- if eq .Values.relocation.telemetry.source "sidecar" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "aegis-statefulset.fullname" . }}-telemetry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-statefulset.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry
spec:
  # ServiceMonitor selector matches SERVICE labels (the headless
  # service), not per-pod labels — aegis.io/role does not belong here.
  selector:
    matchLabels:
      {{- include "aegis-statefulset.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: stateful-data
  endpoints:
    - port: metrics-tenant
      interval: 30s
      path: /metrics
      scheme: http
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}
