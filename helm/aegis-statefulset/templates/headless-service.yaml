apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis-statefulset.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-statefulset.labels" . | nindent 4 }}
    app.kubernetes.io/component: stateful-data
spec:
  # Headless — no clusterIP, lets DNS resolve to individual pod IPs
  # This is the K8s primitive that makes per-pod routing physically possible
  # (per ADR-01 enabling primitive section, ADR-03 routing).
  clusterIP: None
  selector:
    {{- include "aegis-statefulset.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: stateful-data
  ports:
    - name: app
      port: 8080
      targetPort: 8080
      protocol: TCP
    # Per-tenant size telemetry endpoint (per ADR-01).
    # Scraped by ServiceMonitor in templates/servicemonitor-telemetry.yaml.
    # Only meaningful when relocation.telemetry.source == "sidecar"; the port
    # stays declared regardless because Service definitions don't tolerate
    # being patched at upgrade time without churn (and exposing an unused
    # name has no runtime cost on a headless service).
    - name: metrics-tenant
      port: 9091
      targetPort: 9091
      protocol: TCP
  # publishNotReadyAddresses lets Envoy / migration scripts reach pods
  # during their bootstrap window when readiness probes haven't passed yet
  publishNotReadyAddresses: false  # Set to true only for migration windows
