# Velero Schedule B — DR tier (per ADR-04 § dual-cadence pattern).
#
# Looser cadence (4h default) for region-failure recovery. Cross-region
# replication enabled via:
#   - storageLocation: default (BSL bucket with cross-region replication)
#   - snapshotMoveData: true (CSI: invokes EBS CopySnapshot to DR region)
#   - volumeSnapshotLocations: [source-region, dr-region]
#
# Cadence math (per cost-estimate-methodology.md):
#   spec RPO ≤ 6h
#   = 4h cadence + ~15min copy duration + 30min retry margin = 4h45m ≤ 6h ✅
#   → 1h15m headroom against spec ceiling
#
# Hook fsfreeze same as Schedule A — application consistency requirement
# is identical for both tiers.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: {{ include "aegis-statefulset.fullname" . }}-schedule-dr
  namespace: velero
  labels:
    {{- include "aegis-statefulset.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
    aegis.io/backup-tier: dr
spec:
  schedule: "0 */{{ .Values.backup.dr.cadence_hours }} * * *"
  template:
    includedNamespaces:
      - {{ .Release.Namespace }}
    excludedNamespaces:
      - kube-system
      - monitoring
      - kyverno
      - external-secrets
      - velero
      - karpenter
      - argocd
    snapshotVolumes: true
    snapshotMoveData: true  # DR tier: replicate across regions
    ttl: "{{ .Values.backup.dr.retention_days }}d"
    storageLocation: default  # replicated BSL bucket (velero_bsl)
    volumeSnapshotLocations:
      - source-region
      - dr-region
    hooks:
      resources:
        - name: stateful-fsfreeze
          includedNamespaces:
            - {{ .Release.Namespace }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: stateful-data
          # ──────────────────────────────────────────────────────────
          # APPLICATION CONSISTENCY HOOK — REPLACE FOR PRODUCTION LDB.
          # ──────────────────────────────────────────────────────────
          # POC mock: `sync && echo` is a no-op acknowledgement of the
          # hook surface — the mock has no MemTable, no WAL, no file
          # lock to flush, so the `sync` is purely for filesystem
          # metadata coherence.
          #
          # Production: replace the command with the application's
          # admin quiesce endpoint, which must perform in order:
          #   1. Stop accepting writes (set read-only flag or grab
          #      the WAL mutex).
          #   2. Flush MemTable → SSTable (LevelDB: implicit flush on
          #      DB::Close-equivalent path, or an explicit
          #      CompactRange; RocksDB: db->Flush(opts)).
          #   3. fsync the WAL file + data directory.
          #   4. Return 200 OK to acknowledge quiesce ready.
          # The post-hook then releases the read-only flag / drops the
          # mutex.
          #
          # The DR-tier cadence is looser than operational (4h vs 5min)
          # so the per-backup quiesce window is less frequent, but the
          # consistency requirement is identical — a corrupt DR snapshot
          # only surfaces during region-failure recovery, the worst
          # possible time to discover it.
          # ──────────────────────────────────────────────────────────
          pre:
            - exec:
                container: app
                command: ["/bin/sh", "-c", "sync && echo 'pre-backup quiesce'"]
                onError: Fail
                timeout: 10s
          # Post-hook releases the consistency mode set by the pre-hook.
          # POC mock: no-op `echo`. Production: hit the admin endpoint
          # again to drop the read-only flag / release the WAL mutex so
          # the application resumes writes.
          post:
            - exec:
                container: app
                command: ["/bin/sh", "-c", "echo 'post-backup'"]
                onError: Continue
