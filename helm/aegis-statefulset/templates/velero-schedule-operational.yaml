# Velero Schedule A — operational tier (per ADR-04 § dual-cadence pattern).
#
# Tight cadence (5 min default) for fast roll-back of bad deploys / accidental
# state corruption. Source-region only (snapshotMoveData=false; storageLocation=
# operational which has NO cross-region replication). Pairs with Schedule B
# below for region-failure recovery.
#
# Why dual-cadence:
#   AZ failure recovery → operational snapshot (this Schedule, source region)
#   Region failure recovery → DR snapshot (Schedule B, cross-region)
#   Different RPO tiers + different cost shapes; see ADR-04 + cost-estimate-
#   methodology.md for the math.
#
# Hook fsfreeze quiesces the application before the snapshot to ensure
# consistency (per ADR-02 § snapshot section). For aegis-stateful-mock
# this is a no-op `sync`; production apps should implement an admin
# endpoint that flushes WAL + drops mutex.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: {{ include "aegis-statefulset.fullname" . }}-schedule-operational
  namespace: velero
  labels:
    {{- include "aegis-statefulset.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
    aegis.io/backup-tier: operational
spec:
  schedule: "*/{{ .Values.backup.operational.cadence_minutes }} * * * *"
  template:
    includedNamespaces:
      - {{ .Release.Namespace }}
    excludedNamespaces:
      - kube-system    # terraform helm_release manages
      - monitoring     # terraform helm_release manages
      - kyverno
      - external-secrets
      - velero         # don't backup itself
      - karpenter
      - argocd
    snapshotVolumes: true
    snapshotMoveData: false  # operational tier: source region only
    ttl: "{{ .Values.backup.operational.retention_days }}d"
    storageLocation: operational  # non-replicated BSL bucket
    volumeSnapshotLocations:
      - source-region  # only, NOT dr-region
    hooks:
      resources:
        - name: stateful-fsfreeze
          includedNamespaces:
            - {{ .Release.Namespace }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: stateful-data
          # ──────────────────────────────────────────────────────────
          # APPLICATION CONSISTENCY HOOK — REPLACE FOR PRODUCTION LDB.
          # ──────────────────────────────────────────────────────────
          # POC mock: `sync && echo` is a no-op acknowledgement of the
          # hook surface — the mock has no MemTable, no WAL, no file
          # lock to flush, so the `sync` is purely for filesystem
          # metadata coherence.
          #
          # Production: replace the command with the application's
          # admin quiesce endpoint, which must perform in order:
          #   1. Stop accepting writes (set read-only flag or grab
          #      the WAL mutex).
          #   2. Flush MemTable → SSTable (LevelDB: implicit flush on
          #      DB::Close-equivalent path, or an explicit
          #      CompactRange; RocksDB: db->Flush(opts)).
          #   3. fsync the WAL file + data directory.
          #   4. Return 200 OK to acknowledge quiesce ready.
          # The post-hook then releases the read-only flag / drops the
          # mutex.
          #
          # Without this, 5-min cadence will occasionally capture a
          # partially-flushed MemTable → restored volume's LDB Open()
          # rejects the manifest → unrecoverable backup. The failure is
          # silent at backup time and only surfaces on restore.
          # ──────────────────────────────────────────────────────────
          pre:
            - exec:
                container: app
                command: ["/bin/sh", "-c", "sync && echo 'pre-backup quiesce'"]
                onError: Fail
                timeout: 10s
          # Post-hook releases the consistency mode set by the pre-hook.
          # POC mock: no-op `echo`. Production: hit the admin endpoint
          # again to drop the read-only flag / release the WAL mutex so
          # the application resumes writes.
          post:
            - exec:
                container: app
                command: ["/bin/sh", "-c", "echo 'post-backup'"]
                onError: Continue
